<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>게시판</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><main>
<h1>게시글 목록</h1>
<p>전체 <strong th:text="${pageInfo.totalCount}">0</strong>개</p>
<div class="table-wrap"><table>
<thead><tr><th>번호</th><th>제목</th><th>작성자</th><th>등록일</th></tr></thead>
<tbody>
<tr th:if="${#lists.isEmpty(postList)}"><td colspan="4">등록된 게시글이 없습니다.</td></tr>
<tr th:each="post : ${postList}">
<td th:text="${post.postNo}">1</td>
<td><a th:href="@{/Post/read(PostNo=${post.postNo})}" th:text="${post.title}">제목</a></td>
<td th:text="${post.writer}">작성자</td>
<td th:text="${#temporals.format(post.regDate, 'yyyy-MM-dd HH:mm')}">등록일</td>
</tr></tbody></table></div>
<nav aria-label="페이지 이동">
<a th:if="${pageInfo.hasPrevious}" th:href="@{/Post/list(page=1)}">처음</a>
<a th:if="${pageInfo.hasPrevious}" th:href="@{/Post/list(page=${pageInfo.page - 1})}">이전</a>
<th:block th:each="n : ${#numbers.sequence(pageInfo.startPage, pageInfo.endPage)}">
<strong th:if="${n == pageInfo.page}" aria-current="page" th:text="${n}">1</strong>
<a th:unless="${n == pageInfo.page}" th:href="@{/Post/list(page=${n})}" th:text="${n}">2</a>
</th:block>
<a th:if="${pageInfo.hasNext}" th:href="@{/Post/list(page=${pageInfo.page + 1})}">다음</a>
<a th:if="${pageInfo.hasNext}" th:href="@{/Post/list(page=${pageInfo.totalPages})}">마지막</a>
</nav>
<div class="actions"><a class="button" th:href="@{/Post/insert}">게시글 쓰기</a>
<a th:href="@{/}">메인</a></div>
</main></body></html>
