<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>게시판</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><main>
<h1>게시글 수정</h1>
<form method="post" th:action="@{/Post/update}" th:object="${post}">
<input type="hidden" name="PostNo" th:value="${post.postNo}">
<label for="title">제목</label><input id="title" th:field="*{title}" maxlength="200" required>
<p class="error" th:errors="*{title}"></p>
<label for="writer">작성자</label><input id="writer" th:field="*{writer}" maxlength="50" required>
<p class="error" th:errors="*{writer}"></p>
<label for="content">내용</label><textarea id="content" th:field="*{content}" maxlength="10000" rows="12" required></textarea>
<p class="error" th:errors="*{content}"></p>

<div class="actions"><button type="submit">수정</button><a th:href="@{/Post/list}">목록</a></div>
</form>
<form method="post" th:action="@{/Post/delete}" onsubmit="return confirm('게시글을 삭제할까요?');">
<input type="hidden" name="PostNo" th:value="${post.postNo}">
<button type="submit" class="danger">삭제</button>
</form>
</main></body></html>
